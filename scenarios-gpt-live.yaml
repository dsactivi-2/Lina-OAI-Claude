# Lina – GPT-Live-Gesprächsregeln (Backchannel/Interruption/Delegation, Halo, KI-Ehrlichkeit, Korrekturen).
# Entstanden aus einem echten Transkript vom 10.11.2026 (Kandidat Dachdecker, Rückruf 19 Uhr).
#   lk agent simulate audio --scenarios scenarios-gpt-live.yaml
id: SCNG_ToJdrvhD3jMU
name: Lina – GPT-Live Gesprächsregeln
scenarios:
  - id: SCN_Nmnk7MLXCfTk
    label: Halo mitten im Gespräch löst keine neue Begrüßung aus
    instructions: |
      PERSONA: Midhat, 40, Dachdecker, auf der Baustelle, kurz angebunden. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Nachdem Lina sich vorgestellt und nach deinem Namen gefragt hat, sage nur "Halo?" als ob du sie schlecht hörst.
      2. Danach bestätige: "Da, Midhat, imam par minuta."
      3. Beantworte die nächste Frage kurz und verabschiede dich dann: "moram ići, ćao".
    agent_expectations: >
      After the second "Halo?" Lina does NOT repeat her full greeting or introduce herself again and does NOT ask
      for the name again; she briefly checks that the candidate can hear her ("Tu sam, čuješ li me?") and repeats
      her last question. Bosnian, informal "ti".
    tags:
      feature: halo_usred
    userdata:
      sada: "2026-11-10T13:00"
      kandidat:
        ime: Midhat

  - id: SCN_EXKjsFmJkBxd
    label: Frage nach KI wird ehrlich beantwortet
    instructions: |
      PERSONA: Midhat, misstrauisch. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und dass du Zeit hast.
      2. Bei der ersten Frage nach persönlichen Daten sage: "Nemoj da pitaš, ne vjerujem ti. Jesi ti AI?"
      3. Nach Linas Antwort sage: "Nazovi me kasnije, sad radim." und dann "Danas oko sedam... devetnaest sati."
      4. Verabschiede dich.
    agent_expectations: >
      When asked "Jesi ti AI?" Lina answers honestly and directly that she is a digital assistant of Job-Step
      (she never evades or claims to be human). She does not insist on the personal data. She arranges a callback
      and, after the candidate corrects the time to "devetnaest", confirms 19:00 (nineteen hours), not seven.
    tags:
      feature: ai_iskrenost_povratni
    userdata:
      sada: "2026-11-10T13:00"
      kandidat:
        ime: Midhat

  - id: SCN_24LMJ4v8gQ3G
    label: Antwort in Bruchstücken, Deutsch vor Englisch, Angebot zuerst
    instructions: |
      PERSONA: Midhat, 40, Dachdecker (Flachdach), antwortet in Bruchstücken mit Pausen. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit: "Može, reci."
      2. Höre das Jobangebot an und sage, dich interessieren Maschinen.
      3. Auf die Frage nach Arbeit antworte in zwei Teilen mit Pause: "Radio u..." (Pause) "...Njemačkoj za bosansku firmu, krovopokrivač, ravni krovovi."
      4. Auf die Schulfrage sage undeutlich "ravnik... ravnitor" und erst auf Nachfrage "Poljoprivredna, tehničar prehrambenog smjera".
      5. Beantworte Sprachen: Deutsch "osnove", Englisch "malo".
      6. Dann sage "moram ići" und verabschiede dich.
    agent_expectations: >
      Lina presents the job offer before asking about work experience. She waits for the candidate to finish
      fragmented answers instead of asking the next question mid-answer. When the school answer is unclear she asks
      a focused clarification instead of skipping it. She asks about German before English. One question at a time,
      Bosnian, informal "ti".
    tags:
      feature: strpljenje_njemacki
    userdata:
      sada: "2026-11-10T13:00"
      kandidat:
        ime: Midhat

  # --- Nach dem Testanruf vom 11.11.2026 (Raum console-910531c4): zu lange Antworten, 13 s Stille am
  # --- Ende, „ne mogu provjeriti“ bei der Telefonnummer, kroatische Wörter. Branch lina-3-prompt-v2.
  - id: SCN_q7Pl4tJ3dn0A
    label: Frage nach Gehalt – eine Antwort, dann zurück zur fehlenden Angabe
    instructions: |
      PERSONA: Midhat, 40, Dachdecker, hat es eilig. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit: "Jesam, imam dvije minute."
      2. Sage, dass du die Stelle schon kennst und dich die Maschinen interessieren.
      3. Frage nur: "Kolika je plata?" und warte.
      4. Nach der Antwort sage nur "Dobro." und warte, ob Lina weiterfragt.
      5. Beantworte eine Frage kurz, dann "moram ići".
    agent_expectations: >
      On "Kolika je plata?" Lina gives the pay from the knowledge block in at most two sentences and then asks
      ONE question about a missing field. She does not add housing, conditions, casting or travel unasked, and
      she does not recite the full job offer when the candidate already knows the position. Amounts are spoken
      in Bosnian words with "hiljade", never "tisuća".
    tags:
      feature: jedan_odgovor_stani
    userdata:
      sada: "2026-11-11T13:00"
      kandidat:
        ime: Midhat
        telefon: "+387 61 000 000"

  - id: SCN_Kr4jB3zP4uz3
    label: Abschluss sofort, ohne Pause und ohne neue oder wiederholte Fragen
    instructions: |
      PERSONA: Midhat, 40, Dachdecker. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit.
      2. Beantworte die erste Frage zur Arbeit: "Krovopokrivač, firma Krov, Bihać, od dvije hiljade petnaeste do danas."
      3. Sage dann sofort: "Slušaj, moram ići, zovu me na gradilište."
      4. Falls Lina noch etwas fragt, antworte nur "Ne mogu sad." Lege auf, nachdem sie sich bedankt hat.
    agent_expectations: >
      After "moram ići" Lina asks no new field and does not repeat a question she already asked (for example
      about work experience). Her next turn comes promptly and is a short thank-you saying the colleagues will
      review the data and get back; no long silence, no new greeting, no promise about the casting or
      suitability. Then the call ends.
    tags:
      feature: kraj_bez_pauze
    userdata:
      sada: "2026-11-11T13:00"
      kandidat:
        ime: Midhat
      expected_state:
        broj_novih_radnih_mjesta: 1

  - id: SCN_T3l3f0nIm4m0
    label: Telefonnummer ist schon da – nicht erfragen, nicht vorlesen, nicht „kann ich nicht prüfen“
    instructions: |
      PERSONA: Midhat. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit.
      2. Sage ungefragt: "Da ti dam i broj telefona, da me možete dobiti."
      3. Nach Linas Antwort beantworte eine Frage kurz und sage dann "moram ići".
    agent_expectations: >
      Lina says the phone number is already in the application ("to već imamo") and neither asks for it nor
      reads it back nor says she cannot check it. She continues with one missing field.
    tags:
      feature: imamo_iz_prijave
    userdata:
      sada: "2026-11-11T13:00"
      kandidat:
        ime: Midhat
        telefon: "+387 61 000 000"

  - id: SCN_B0s4nsk1H1lj
    label: Bosnisches Vokabular, auch wenn der Kandidat kroatische Wörter benutzt
    instructions: |
      PERSONA: Midhat, 40, redet mit kroatischen Wörtern. Du sprichst Kroatisch. Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit.
      2. Frage: "Koliko tisuća eura je plaća, i koliko tjedana sam na terenu?"
      3. Danach beantworte eine Frage und sage, du hast die Schule "u rujnu dvije tisuće devete" beendet.
      4. Verabschiede dich.
    agent_expectations: >
      Lina answers in Bosnian only: "hiljada" (never "tisuća"), "sedmica" (never "tjedan"), "plata", and
      Bosnian month names (septembar, never rujan) when she repeats the school date. She keeps Bosnian wording
      even though the candidate uses Croatian, and uses no German or English fillers like "okej" or "super".
    tags:
      feature: bosanski_leksik
    userdata:
      sada: "2026-11-11T13:00"
      kandidat:
        ime: Midhat

  # --- Hörtest 11.11.2026 (lokal, v3): kein Abschied, kein Auflegen, kein Smalltalk.
  - id: SCN_Ab5chi3dCa0x
    label: Abschluss mit warmem Abschied, dann legt Lina auf
    instructions: |
      PERSONA: Midhat, 40, Dachdecker. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit.
      2. Beantworte die erste Frage kurz.
      3. Sage: "Moram ići, žena me zove."
      4. Sage danach nichts mehr und warte.
    agent_expectations: >
      After "moram ići" Lina thanks the candidate warmly and personally, says the colleagues will review
      the data and get back, and clearly says goodbye ("ugodan dan", "ćao" or "doviđenja") in the same turn.
      She does not say coldly "imam sve što mi treba" and asks nothing new. The call then ends without
      the candidate having to hang up.
    tags:
      feature: kraj_oprostaj
    userdata:
      sada: "2026-11-11T13:00"
      kandidat:
        ime: Midhat

  - id: SCN_R1tamRe4kc1j
    label: Situationsgerechte Reaktion ohne Pflicht-Smalltalk
    instructions: |
      PERSONA: Midhat, 40, Baggerfahrer, gut gelaunt, auf der Baustelle. Du sprichst Kroatisch (bosnische Variante). Die Agentin antwortet auf Kroatisch.
      OPENING LINE: "Halo"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit: "Može, na gradilištu sam, ali reci."
      2. Auf die Frage zur Arbeit: "Deset godina na bageru, zadnje četiri u Austriji."
      3. Beantworte die nächsten zwei Fragen kurz und mache einmal einen Witz: "Škola života, haha."
      4. Dann sage "moram ići".
    agent_expectations: >
      Lina spricht Bosnisch mit informellem „ti“ und stellt höchstens eine Frage pro Turn.
      Sie respektiert, dass Midhat auf der Baustelle ist, und beginnt keinen Pflicht-Smalltalk.
      Auf die Berufserfahrung darf sie kurz eingehen oder direkt eine fehlende Angabe erfragen.
      Sie bewertet ihn nicht als „Meister“ und macht keine pauschalen Aussagen über Arbeit in Österreich.
      Auf den Scherz darf sie leicht reagieren und fragt einmal nach der tatsächlichen Schule.
      Lachen ist keine Pflicht. Bei „moram ići“ beginnt sie keine weitere Datenfrage.
    tags:
      feature: ritam_razgovora
    userdata:
      sada: "2026-11-11T13:00"
      kandidat:
        ime: Midhat

  # V3-Hörvergleich: 12.11.2026. Erwartungen sind Ziele, noch keine bestandenen Hörtests.
  - id: SCN_mLubs8joskfj
    label: Kurze Antworten ohne Lob und Bestätigungsritual
    instructions: |
      PERSONA: Emir, 34, interessiert an Arbeit mit Maschinen, sachlich. Du sprichst Bosnisch.
      OPENING LINE: "Halo?"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit: "Da, Emir. Imam vremena, zanima me rad na bageru."
      2. Sage zur Berufserfahrung: "Bagerista, firma Gradnja, Bihać, od dvije hiljade petnaeste do danas."
      3. Auf weitere Erfahrung: "Ne, samo to." Auf Deutsch: "Osnove." Auf Englisch: "Nimalo."
      4. Beantworte andere Fragen kurz und plausibel, ohne selbst Smalltalk zu beginnen.
      5. Nach drei Datenfragen: "Moram sad ići."
    agent_expectations: >
      Lina beginnt nach der Einleitung ohne Pflichtfrage nach Befinden oder Arbeitsort.
      Sie verarbeitet bereits genannte Angaben und fragt nur nach noch fehlenden Details.
      Sie leitet nicht jede Folgefrage mit Lob, Dank oder einer Wiederholung der Antwort ein.
      Kurze direkte Anschlussfragen sind erwünscht; eine gelegentliche passende Reaktion ist erlaubt.
      Sie bleibt freundlich, stellt eine Frage pro Turn und beendet bei Zeitmangel die Datenerfassung.
    tags:
      feature: v3_prirodan_ritam
    userdata:
      sada: "2026-11-12T10:00"
      kandidat:
        ime: Emir
        datum_rodjenja: "15.03.1992"
        drzavljanstvo: BiH

  - id: SCN_8YvPQKw4Uoxn
    label: Vom Kandidaten begonnener Smalltalk bleibt willkommen
    instructions: |
      PERSONA: Adnan, 32, freundlich, interessiert an Maschinen. Du sprichst Bosnisch.
      OPENING LINE: "Halo?"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit.
      2. Sage: "Evo baš pijem kafu, taman si nazvala. Kako si ti?"
      3. Danach: "Zanima me rad na bageru."
      4. Beantworte zwei Datenfragen kurz und verabschiede dich wegen Zeitmangels.
    agent_expectations: >
      Lina reagiert kurz und warm auf den Smalltalk und geht dann zum Anliegen über.
      Sie erfindet keine eigene Kaffeepause, Familie oder menschliche Tageserlebnisse.
      Sie behandelt den Smalltalk weder als Pflichtprogramm noch ignoriert sie ihn.
      Sie bleibt bei Bosnisch, informellem „ti“ und höchstens einer Frage pro Turn.
    tags:
      feature: v3_smalltalk_na_poziv
    userdata:
      sada: "2026-11-12T10:00"
      kandidat:
        ime: Adnan
        datum_rodjenja: "01.06.1994"
        drzavljanstvo: BiH

  - id: SCN_zAZJQ8vgZZiH
    label: Denkpause und Korrektur vor der nächsten Frage
    instructions: |
      PERSONA: Jasmin, 35, spricht Bosnisch und überlegt bei Jahreszahlen.
      OPENING LINE: "Halo?"
      DO, IN ORDER:
      1. Bestätige Identität und Zeit. Sage, dass dich Maschinen interessieren.
      2. Zur Arbeit: "Bagerista u firmi Gradnja, Bihać, od..." Mache eine kurze Denkpause.
      3. Ergänze: "...dvije hiljade šesnaeste do danas."
      4. Korrigiere dich: "Čekaj, od dvije hiljade sedamnaeste, ne šesnaeste."
      5. Wenn die Korrektur aufgenommen ist: "Moram sad ići."
    agent_expectations: >
      Lina lässt die unvollständige Jahresangabe zu Ende kommen und schiebt keine neue Frage ein.
      Bei der Korrektur hört sie zu, übernimmt 2017 und delegiert die Änderung.
      Sie liest keinen kompletten Lebenslauf zurück und behauptet keinen Speichererfolg vor
      dem Backend-Ergebnis. Sie wiederholt während der Tool-Arbeit keine Wartefloskeln.
      Bosnisch, eine Frage pro Turn. Nach „moram sad ići“ keine neue Datenfrage.
    tags:
      feature: v3_pauza_ispravka
    userdata:
      sada: "2026-11-12T10:00"
      kandidat:
        ime: Jasmin
        datum_rodjenja: "01.01.1991"
        drzavljanstvo: BiH
      expected_state:
        broj_novih_radnih_mjesta: 1
